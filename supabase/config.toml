
[functions.delete-cloudinary-image]
enabled = true
# Auth is handled inside the function: Supabase JWT for clients, or DELETE_CLOUDINARY_IMAGE_SECRET for server-to-server calls.
verify_jwt = false
import_map = "./functions/delete-cloudinary-image/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-cloudinary-image/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-cloudinary-image/*.html" ]
